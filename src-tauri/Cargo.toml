[package]
name = "devvoice-desktop"
version = "0.1.30"
description = "DevVoice desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "devvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }
anyhow = "1.0.102"
axum = "0.8"
any-tts = { version = "=0.1.1", default-features = false, features = ["download", "vibevoice", "kokoro", "metal"] }
candle-core = { version = "0.9.2", features = ["metal"] }
candle-nn = { version = "0.9.2", features = ["metal"] }
candle-transformers = { version = "0.9.2", features = ["metal"] }
directories = "5"
get-selected-text = "0.1.6"
hf-hub = { version = "1.0.0-rc.0", features = ["blocking"] }
keyring-core = "1.0.0"
macos-accessibility-client = "0.0.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = "0.22.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tokio = { version = "1.52.2", features = ["rt-multi-thread", "sync", "time", "net"] }
tokenizers = "0.22.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.3.1"
